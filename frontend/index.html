<!doctype html>
<html lang="en" class="light" style="color-scheme: light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!--
      maximum-scale=1 + user-scalable=no stop iOS Safari from auto-zooming
      into inputs on focus and from pinch/double-tap zooming the app shell.
      viewport-fit=cover lets the layout use safe-area insets (notch/home bar).
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#F7F3EC" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="description" content="Smart control for your air conditioner via Raspberry Pi and IR." />
    <title>AcController</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
