<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tray panel - compact</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --ice: #8fd3ff; --blue: #4b9dff; --ease: cubic-bezier(.22,1,.36,1); --spring: cubic-bezier(.34,1.4,.5,1); --sub: rgba(255,255,255,.5); }
  body { min-height: 100vh; padding: 40px 24px; font: 12px/1.35 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; color: #fff;
         background: #1a1e26; background-image: radial-gradient(55% 45% at 25% 15%, #2f4a6d, transparent), radial-gradient(50% 50% at 85% 90%, #3a2d4d, transparent); }
  h2 { font-size: 17px; font-weight: 600; } .note { color: #a6adbb; margin: 2px 0 28px; }
  .stage { display: flex; flex-direction: column; align-items: center; }
  .cap { color: #a6adbb; font-size: 12px; margin-top: 10px; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  svg { display: block; }
  .ic { fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }

  .panel { width: 264px; padding: 12px; border-radius: 16px; position: relative; overflow: hidden;
           background: radial-gradient(110% 55% at 50% 0%, rgba(46,98,190,.4), transparent 70%), linear-gradient(180deg, #10203d, #0a1426 65%, #080f1c);
           box-shadow: inset 0 1px 0 rgba(255,255,255,.18), inset 0 0 0 1px rgba(255,255,255,.07), 0 24px 60px -24px #000;
           animation: enter .45s var(--ease); }
  @keyframes enter { from { transform: translateY(12px) scale(.98); opacity: 0; } }

  /* header */
  .hd { display: flex; align-items: center; gap: 8px; }
  .hd .t { flex: 1; min-width: 0; }
  .name { font-size: 13px; font-weight: 600; }
  .status { font-size: 11px; color: var(--sub); display: flex; align-items: center; gap: 5px; }
  .status i { width: 5px; height: 5px; border-radius: 50%; background: #3ee08f; }
  .pw { position: relative; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,.08);
        box-shadow: inset 0 0 0 1px rgba(255,255,255,.1); transition: background .4s var(--ease), box-shadow .4s var(--ease), transform .15s; }
  .pw:active { transform: scale(.9); }
  .pw svg { width: 15px; height: 15px; color: rgba(255,255,255,.65); transition: color .3s; }
  .on .pw { background: linear-gradient(145deg,#5aa8ff,#2f6fe0); box-shadow: inset 0 1px 0 rgba(255,255,255,.4), 0 4px 14px -4px rgba(75,157,255,.9); }
  .on .pw svg { color: #fff; }
  .pw::after { content: ""; position: absolute; inset: 0; border-radius: 50%; border: 2px solid rgba(143,211,255,.7); opacity: 0; }
  .pw.pulse::after { animation: ring .6s var(--ease); }
  @keyframes ring { from { transform: scale(1); opacity: .8; } to { transform: scale(1.6); opacity: 0; } }

  /* scene: unit, wind and temperature share one block */
  .scene { position: relative; height: 128px; margin: 6px -12px 0; }
  .scene canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .unit { position: absolute; left: 50%; top: 2px; width: 148px; height: 36px; margin-left: -74px; border-radius: 11px 11px 8px 8px;
          background: linear-gradient(180deg,#fff,#eef2f8 55%,#d2d9e4); box-shadow: inset 0 1px 0 #fff, inset 0 -3px 4px rgba(20,40,80,.12), 0 8px 18px -8px rgba(0,0,0,.8); }
  .unit::before { content: ""; position: absolute; left: 10px; right: 10px; top: 4px; height: 4px; border-radius: 2px; background: repeating-linear-gradient(90deg, rgba(40,60,90,.14) 0 2px, transparent 2px 5px); }
  .led { position: absolute; left: 12px; top: 15px; width: 4px; height: 4px; border-radius: 50%; background: #b7c0cc; transition: background .5s, box-shadow .5s; }
  .on .led { background: var(--blue); box-shadow: 0 0 6px var(--blue); }
  .disp { position: absolute; right: 10px; top: 11px; padding: 1px 5px; border-radius: 3px; background: #0d1a2e; color: var(--ice); font-size: 9px; font-weight: 700; transition: opacity .5s; }
  .panel:not(.on) .disp { opacity: .15; }
  .mouth { position: absolute; left: 8px; right: 8px; bottom: 3px; height: 7px; border-radius: 4px; background: linear-gradient(#26303f,#4e596b); perspective: 140px; }
  .flap { position: absolute; inset: 0; border-radius: 4px; background: linear-gradient(#f4f7fb,#c9d2df); transform-origin: 50% 0; transition: transform .9s var(--ease); }
  .on .flap { transform: rotateX(-60deg); animation: swing 5s ease-in-out .9s infinite alternate; }
  @keyframes swing { from { transform: rotateX(-48deg); } to { transform: rotateX(-70deg); } }

  .temp { position: absolute; left: 12px; right: 12px; bottom: 0; display: flex; align-items: center; justify-content: space-between; }
  .step { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,.06);
          box-shadow: inset 0 0 0 1px rgba(255,255,255,.08); transition: background .2s, transform .12s, opacity .3s; }
  .step:hover { background: rgba(255,255,255,.12); } .step:active { transform: scale(.88); background: rgba(75,157,255,.35); }
  .step svg { width: 13px; height: 13px; }
  .num { font-size: 38px; font-weight: 250; line-height: 1; letter-spacing: -1.5px; font-variant-numeric: tabular-nums; text-shadow: 0 2px 12px rgba(5,12,25,.9); transition: opacity .4s; }
  .num sup { font-size: 13px; font-weight: 400; color: #6fb0ff; position: relative; top: -2px; margin-left: 1px; letter-spacing: 0; }
  .num.up { animation: up .32s var(--ease); } .num.down { animation: down .32s var(--ease); }
  @keyframes up { from { transform: translateY(8px); opacity: .3; } } @keyframes down { from { transform: translateY(-8px); opacity: .3; } }
  .panel:not(.on) .num, .panel:not(.on) .step { opacity: .35; }

  /* one row: mode | fan */
  .row { display: flex; gap: 6px; margin-top: 10px; }
  .seg { position: relative; display: grid; grid-template-columns: repeat(var(--n), 1fr); padding: 2px; border-radius: 10px; background: rgba(0,0,0,.25); box-shadow: inset 0 1px 2px rgba(0,0,0,.35); transition: opacity .35s; }
  #fan { flex: 1; }
  #fan button { height: 40px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
  .fi { display: flex; align-items: center; gap: 3px; height: 18px; }
  .fan { width: 17px; height: 17px; fill: currentColor; }
  .w i { height: 2px !important; }
  .fn { font-size: 10px; font-weight: 600; letter-spacing: .2px; }
  .ws { width: 6px; height: 15px; }
  .w { display: flex; flex-direction: column; gap: 2px; }
  .w i { display: block; height: 1.6px; border-radius: 1px; background: currentColor; }
  .w i:nth-child(1) { width: 5px; } .w i:nth-child(2) { width: 7px; } .w i:nth-child(3) { width: 4px; }
  .w1 i { width: 6px !important; } .w2 i:nth-child(1) { width: 7px; } .w2 i:nth-child(2) { width: 4px; }
  .on .seg button.on .fan { animation: spin var(--spd, 1.4s) linear infinite; }
  .on .seg button.on .w i { animation: gust var(--spd, 1.4s) ease-in-out infinite; }
  .w i:nth-child(2) { animation-delay: .15s !important; } .w i:nth-child(3) { animation-delay: .3s !important; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes gust { 50% { transform: translateX(2px); opacity: .45; } }
  [data-v="eco"] { --spd: 2.4s; } [data-v="low"] { --spd: 1.4s; } [data-v="medium"] { --spd: .8s; } [data-v="high"] { --spd: .42s; }

  /* temperature slider */
  /* pill slider: the fill is the control, no thumb or ticks */
  .slider { position: relative; height: 26px; margin-top: 10px; border-radius: 13px; overflow: hidden;
            background: rgba(0,0,0,.25); box-shadow: inset 0 1px 2px rgba(0,0,0,.35), inset 0 0 0 1px rgba(255,255,255,.04); transition: opacity .35s, transform .2s var(--ease); }
  .slider .fill { position: absolute; left: 0; top: 0; bottom: 0; width: calc(26px + (100% - 26px) * var(--p));
                  border-radius: 13px; background: linear-gradient(90deg, rgba(75,157,255,.55), rgba(143,211,255,.75));
                  box-shadow: inset 0 1px 0 rgba(255,255,255,.35); transition: width .3s var(--ease); }
  .slider .fill::after { content: ""; position: absolute; right: 8px; top: 8px; bottom: 8px; width: 3px; border-radius: 2px; background: rgba(255,255,255,.85); }
  .slider .end { position: absolute; top: 0; bottom: 0; display: flex; align-items: center; font-size: 10px; font-weight: 600; pointer-events: none; color: rgba(255,255,255,.35); }
  .slider .end.l { left: 10px; color: rgba(255,255,255,.75); } .slider .end.r { right: 10px; }
  .slider .end svg { width: 12px; height: 12px; }
  .slider input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; margin: 0; }
  .slider:hover { box-shadow: inset 0 1px 2px rgba(0,0,0,.35), inset 0 0 0 1px rgba(143,211,255,.18); }
  .slider.drag { transform: scaleY(1.08); } .slider.drag .fill { transition: none; }
  .panel:not(.on) .slider { opacity: .35; pointer-events: none; }
  .fl { display: flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600; }
  .fl .bars { height: 10px; } .fl .bars i:nth-child(4) { height: 10px; } .fl .bars i:nth-child(3) { height: 8px; } .fl .bars i:nth-child(2) { height: 6px; } .fl .bars i:nth-child(1) { height: 3px; }
  .lens { position: absolute; top: 2px; bottom: 2px; left: 2px; width: calc((100% - 4px) / var(--n)); border-radius: 8px; transform: translateX(calc(var(--i) * 100%)); transition: transform .45s var(--spring); }
  .lens::before { content: ""; position: absolute; inset: 0; border-radius: inherit; background: rgba(255,255,255,.14); box-shadow: inset 0 1px 0 rgba(255,255,255,.28), 0 2px 6px -2px rgba(0,0,0,.5); }
  .lens.stretch::before { animation: stretch .45s var(--ease); }
  @keyframes stretch { 35% { transform: scaleX(1.15) scaleY(.88); } }
  .seg button { position: relative; height: 30px; display: grid; place-items: center; color: var(--sub); transition: color .25s; }
  .seg button svg { width: 15px; height: 15px; }
  .seg button.on { color: var(--ice); }
  .seg button:hover:not(.on) { color: rgba(255,255,255,.8); }
  .panel:not(.on) .row .seg { opacity: .4; pointer-events: none; }
  /* fan level bars */
  .bars { display: flex; align-items: flex-end; gap: 2px; height: 12px; }
  .bars i { width: 3px; border-radius: 1px; background: currentColor; opacity: .3; }
  .bars i:nth-child(1) { height: 4px; } .bars i:nth-child(2) { height: 7px; } .bars i:nth-child(3) { height: 10px; } .bars i:nth-child(4) { height: 12px; }
  .bars.l1 i:nth-child(-n+1), .bars.l2 i:nth-child(-n+2), .bars.l3 i:nth-child(-n+3), .bars.l4 i:nth-child(-n+4) { opacity: 1; }

  /* timer row */
  .timer { display: flex; gap: 6px; margin-top: 6px; }
  .tk { flex: none; height: 26px; padding: 0 8px; border-radius: 9px; display: flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600; color: var(--sub); background: rgba(255,255,255,.05);
        transition: color .25s, background .25s; }
  .tk:hover { color: #fff; } .tk svg { width: 13px; height: 13px; }
  .tk .lab { display: inline-block; min-width: 38px; }
  .tk .lab.flip { animation: flip .3s var(--ease); } @keyframes flip { from { transform: translateY(5px); opacity: 0; } }
  #timer { flex: 1; } #timer button { height: 22px; font-size: 11px; font-weight: 600; }
  #timer button.on { color: #fff; }
  .left { position: absolute; right: 12px; top: 12px; }

  .chip { display: flex; align-items: center; gap: 6px; font-size: 11px; color: #ffb3ad; overflow: hidden; max-height: 22px; margin-top: 6px; transition: max-height .35s var(--ease), opacity .3s, margin .35s var(--ease); }
  .chip.gone { max-height: 0; opacity: 0; margin-top: 0; }
  .chip i { width: 5px; height: 5px; border-radius: 50%; background: #ff6a5f; animation: blink 1.6s ease-in-out infinite; } @keyframes blink { 50% { opacity: .3; } }
  .chip b { font-weight: 600; font-variant-numeric: tabular-nums; color: #fff; }
  .chip button { margin-left: auto; color: var(--sub); font-size: 11px; } .chip button:hover { color: #fff; }
  [data-tip] { position: relative; }
  [data-tip]:hover::after { content: attr(data-tip); position: absolute; bottom: calc(100% + 6px); left: 50%; transform: translateX(-50%); white-space: nowrap; padding: 3px 7px; border-radius: 6px;
                            background: #1d2b44; color: #fff; font-size: 10.5px; font-weight: 500; box-shadow: 0 4px 12px rgba(0,0,0,.5); pointer-events: none; animation: tip .2s var(--ease); z-index: 3; }
  @keyframes tip { from { opacity: 0; transform: translate(-50%, 3px); } }

  /* ---- larger sizing ---- */
  body { font-size: 13px; }
  .panel { width: 304px; padding: 15px; border-radius: 18px; }
  .name { font-size: 14.5px; } .status { font-size: 12px; }
  .pw { width: 38px; height: 38px; } .pw svg { width: 17px; height: 17px; }
  .scene { height: 180px; margin: 8px -15px 0; }
  .unit { width: 236px; height: 62px; margin-left: -118px; border-radius: 17px 17px 12px 12px; }
  .unit::before { left: 16px; right: 16px; top: 7px; height: 6px; }
  .led { left: 19px; top: 26px; width: 6px; height: 6px; }
  .disp { right: 16px; top: 19px; padding: 2px 8px; border-radius: 5px; font-size: 12.5px; }
  .mouth { left: 12px; right: 12px; bottom: 5px; height: 12px; border-radius: 6px; }
  /* number while dragging: quick fade only, no restart jitter */
  /* odometer reel: the numbers scroll continuously, then settle */
  .reel { display: inline-block; height: 1.05em; overflow: hidden; vertical-align: top;
          -webkit-mask-image: linear-gradient(transparent, #000 10%, #000 90%, transparent); mask-image: linear-gradient(transparent, #000 10%, #000 90%, transparent); }
  .strip { display: flex; flex-direction: column; transform: translateY(calc(var(--pos) * -1.05em)); transition: transform .5s cubic-bezier(.3,1.3,.5,1); will-change: transform; }
  .strip span { height: 1.05em; line-height: 1.05em; text-align: center; }
  .strip.drag { transition: transform .08s linear; }
  .num.up, .num.down { animation: none !important; }
  .flap { border-radius: 6px; }
  .temp { left: 15px; right: 15px; }
  .step { width: 38px; height: 38px; } .step svg { width: 16px; height: 16px; }
  .num { font-size: 48px; } .num sup { font-size: 16px; }
  .slider { height: 32px; margin-top: 12px; border-radius: 16px; }
  .slider .fill { width: calc(32px + (100% - 32px) * var(--p)); border-radius: 16px; }
  .slider .fill::after { right: 11px; top: 10px; bottom: 10px; }
  .slider .end { font-size: 11.5px; } .slider .end.l { left: 12px; } .slider .end.r { right: 12px; } .slider .end svg { width: 14px; height: 14px; }
  .row { gap: 8px; margin-top: 10px; }
  .seg { padding: 3px; border-radius: 12px; }
  .lens { top: 3px; bottom: 3px; left: 3px; width: calc((100% - 6px) / var(--n)); border-radius: 9px; }
  #fan button { height: 50px; gap: 3px; }
  .fan { width: 20px; height: 20px; } .fi { height: 21px; }
  .fn { font-size: 11.5px; }
  .timer { gap: 8px; margin-top: 8px; }
  .tk { height: 36px; padding: 0 11px; font-size: 12px; border-radius: 11px; } .tk svg { width: 15px; height: 15px; }
  #timer button { height: 30px; font-size: 12px; }
  .chip { font-size: 12px; max-height: 26px; margin-top: 8px; }
</style>
</head>
<body>
<h2>Compact</h2>
<p class="note">Try it: power, − / +, mouse wheel on the number, fan, timer. Cool only.</p>

<svg width="0" height="0" style="position:absolute"><defs>
  <g id="fan"><circle cx="12" cy="12" r="10.5" fill="none" stroke="currentColor" stroke-width="1.4" opacity=".35"/><circle cx="12" cy="12" r="1.9"/>
    <path id="blade" d="M11 10.6C8.6 9.4 7.6 6.6 8.8 4.6c1.2-2 4.4-2.2 5.6-.2 1 1.7.3 3.9-1.6 6.1-.5.5-1.2.5-1.8.1Z"/>
    <use href="#blade" transform="rotate(120 12 12)"/><use href="#blade" transform="rotate(240 12 12)"/></g>
</defs></svg>
<div class="stage">
  <div class="panel on" id="panel">
    <div class="hd">
      <div class="t"><div class="name">Bedroom AC</div><div class="status"><i></i><span id="st">Cooling · Low fan</span></div></div>
      <button class="pw" id="pw" aria-label="Power"><svg class="ic" viewBox="0 0 24 24"><path d="M12 3v9M6.6 6.6a8 8 0 1 0 10.8 0"/></svg></button>
    </div>

    <div class="scene"><canvas id="air"></canvas>
      <div class="unit"><span class="led"></span><span class="disp" id="disp">22°</span><div class="mouth"><div class="flap"></div></div></div>
      <div class="temp" id="temp">
        <button class="step" data-d="-1" aria-label="Cooler"><svg class="ic" viewBox="0 0 24 24"><path d="M6 12h12"/></svg></button>
        <span class="num" id="num"><span class="reel"><span class="strip" id="strip"><span>20</span><span>21</span><span>22</span><span>23</span><span>24</span><span>25</span><span>26</span><span>27</span><span>28</span></span></span><sup>°C</sup></span>
        <button class="step" data-d="1" aria-label="Warmer"><svg class="ic" viewBox="0 0 24 24"><path d="M6 12h12M12 6v12"/></svg></button>
      </div>
    </div>

    <div class="slider" id="slider" style="--p:.25"><div class="fill"></div>
      <span class="end l"><svg class="ic" viewBox="0 0 24 24"><path d="M12 2v20M3.3 7l17.4 10M20.7 7 3.3 17"/></svg></span><span class="end r">28°</span>
      <input type="range" id="range" min="20" max="28" step="1" value="22" aria-label="Temperature"></div>

    <div class="row">
      <div class="seg" id="fan" style="--n:4;--i:1"><span class="lens"></span>
        <button data-v="eco" data-tip="Eco"><span class="fi"><svg viewBox="0 0 24 24" class="fan"><use href="#fan"/></svg><svg viewBox="0 0 10 24" class="ws"><path class="ic" d="M5 9.5c2 0 3 1.2 3 2.5s-1 2.5-3 2.5"/></svg></span><span class="fn">Eco</span></button>
        <button class="on" data-v="low" data-tip="Low"><span class="fi"><svg viewBox="0 0 24 24" class="fan"><use href="#fan"/></svg><span class="w w1"><i></i></span></span><span class="fn">Low</span></button>
        <button data-v="medium" data-tip="Medium"><span class="fi"><svg viewBox="0 0 24 24" class="fan"><use href="#fan"/></svg><span class="w w2"><i></i><i></i></span></span><span class="fn">Med</span></button>
        <button data-v="high" data-tip="High"><span class="fi"><svg viewBox="0 0 24 24" class="fan"><use href="#fan"/></svg><span class="w w3"><i></i><i></i><i></i></span></span><span class="fn">High</span></button>
      </div>
    </div>

    <div class="timer">
      <button class="tk" id="tk" data-tip="Switch timer action"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9 2h6"/></svg><span class="lab" id="tk-lab">Off in</span></button>
      <div class="seg" id="timer" style="--n:4;--i:0"><span class="lens"></span>
        <button class="on" data-v="0">Off</button><button data-v="30">30m</button><button data-v="60">1h</button><button data-v="120">2h</button>
      </div>
    </div>
    <div class="chip gone" id="chip"><i></i><span id="chip-txt">Turns off in</span><b id="chip-left">1h 00m</b><button id="chip-x">Cancel</button></div>
  </div>
  <div class="cap">304 × ~405 px. "Open full app" and "Start with Windows" move to the tray right-click menu.</div>
</div>

<script>
const $ = (id) => document.getElementById(id)
const panel = $('panel')
const S = { on: true, t: 22, mode: 'cool', fan: 'low', timer: 0, endsAt: 0, act: 'off' }
const MODE = { cool: 'Cool', heat: 'Heat', dry: 'Dry' }, FAN = { eco: 'Eco', low: 'Low', medium: 'Med', high: 'High' }
const RGB = { cool: [143, 211, 255], heat: [255, 176, 106], dry: [130, 232, 205] }
const MULT = { eco: .5, low: .8, medium: 1.15, high: 1.6 }

/* airflow */
const cv = $('air'), ctx = cv.getContext('2d')
let W, H, parts = [], inten = 1, col = RGB.cool.slice(), acc = 0, last = 0
function size() { const r = cv.getBoundingClientRect(), d = devicePixelRatio || 1; W = r.width; H = r.height; cv.width = W * d; cv.height = H * d; ctx.setTransform(d, 0, 0, d, 0, 0) }
size(); addEventListener('resize', size)
const Y0 = 62
function spawn(now) {
  const cx = W / 2, half = 100, x = cx + (Math.random() * 2 - 1) * half, s = (x - cx) / half, sw = Math.sin(now / 1700) * .6
  parts.push({ x, y: Y0, px: x, py: Y0, vx: s * 16 + sw * 10, vy: 30 + Math.random() * 20, life: 0, max: 1.1 + Math.random() * .8, w: .6 + Math.random() * 1.2, ph: Math.random() * 6.3 })
}
function frame(now) {
  const dt = Math.min(.05, (now - (last || now)) / 1000) || .016; last = now
  inten += ((S.on ? 1 : 0) - inten) * Math.min(1, dt * 2.4)
  const tc = RGB[S.mode]; for (let k = 0; k < 3; k++) col[k] += (tc[k] - col[k]) * Math.min(1, dt * 3)
  const [r, g, b] = col.map(Math.round), m = MULT[S.fan]
  ctx.clearRect(0, 0, W, H)
  if (inten > .01) {
    const gr = ctx.createRadialGradient(W / 2, Y0, 2, W / 2, Y0 + 20, 95)
    gr.addColorStop(0, `rgba(${r},${g},${b},${.18 * inten})`); gr.addColorStop(1, `rgba(${r},${g},${b},0)`)
    ctx.fillStyle = gr; ctx.fillRect(0, Y0 - 2, W, H)
  }
  acc += dt * 55 * inten * m
  while (acc >= 1) { spawn(now); acc-- }
  ctx.lineCap = 'round'
  const sp = .55 + m * .6
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i]; p.life += dt
    if (p.life > p.max || p.y > H) { parts.splice(i, 1); continue }
    p.px = p.x; p.py = p.y
    p.x += (p.vx + Math.sin(p.ph + p.life * 3.2) * 6) * dt * sp; p.y += p.vy * dt * sp
    p.vx *= 1 + dt * .4; p.vy *= 1 - dt * .2
    const t = p.life / p.max, fade = t < .15 ? t / .15 : 1 - (t - .15) / .85
    const depth = 1 - Math.max(0, (p.y - 118) / 62) * .6   // softer behind the temperature
    const a = Math.max(0, fade) * .75 * depth * Math.min(1, inten * 1.4); if (a < .01) continue
    const vx = (p.x - p.px) / dt, vy = (p.y - p.py) / dt, L = .2
    const gl = ctx.createLinearGradient(p.x - vx * L, p.y - vy * L, p.x, p.y)
    gl.addColorStop(0, `rgba(${r},${g},${b},0)`); gl.addColorStop(1, `rgba(${r},${g},${b},${a})`)
    ctx.strokeStyle = gl; ctx.lineWidth = p.w; ctx.beginPath(); ctx.moveTo(p.x - vx * L, p.y - vy * L); ctx.lineTo(p.x, p.y); ctx.stroke()
  }
  requestAnimationFrame(frame)
}
requestAnimationFrame(frame)

/* controls */
let prevT = S.t, dragging = false, pos = S.t
const strip = $('strip')
function setPos(v) { strip.style.setProperty('--pos', v - 20); $('slider').style.setProperty('--p', (v - 20) / 8) }
function paint() {
  panel.classList.toggle('on', S.on)
  $('disp').textContent = S.t + '°'
  setPos(dragging ? pos : S.t)
  prevT = S.t
  if (!dragging && +$('range').value !== S.t) $('range').value = S.t
  $('st').textContent = S.on ? `Cooling · ${FAN[S.fan]} fan` : 'Off'
}
function seg(id, onPick) {
  const el = $(id), lens = el.querySelector('.lens'), btns = [...el.querySelectorAll('button')]
  const pick = (i) => {
    el.style.setProperty('--i', i); btns.forEach((x, k) => x.classList.toggle('on', k === i))
    lens.classList.remove('stretch'); void lens.offsetWidth; lens.classList.add('stretch')
    onPick(btns[i].dataset.v)
  }
  btns.forEach((b, i) => b.onclick = () => pick(i))
  return pick
}
seg('fan', v => { S.fan = v; paint() })
const pickTimer = seg('timer', v => { S.timer = +v; S.endsAt = Date.now() + S.timer * 60000; $('chip').classList.toggle('gone', !S.timer); chip() })
$('tk').onclick = () => { S.act = S.act === 'off' ? 'on' : 'off'; const l = $('tk-lab'); l.textContent = S.act === 'off' ? 'Off in' : 'On in'; l.classList.remove('flip'); void l.offsetWidth; l.classList.add('flip'); chip() }
$('chip-x').onclick = () => pickTimer(0)
function chip() {
  $('chip-txt').textContent = S.act === 'off' ? 'Turns off in' : 'Turns on in'
  if (!S.timer) return; const m = Math.max(0, Math.round((S.endsAt - Date.now()) / 60000))
  $('chip-left').textContent = m >= 60 ? `${Math.floor(m / 60)}h ${String(m % 60).padStart(2, '0')}m` : `${m}m`
}
setInterval(chip, 15000)

$('pw').onclick = () => { const b = $('pw'); b.classList.remove('pulse'); void b.offsetWidth; b.classList.add('pulse'); S.on = !S.on; paint() }
const bump = (d) => { if (!S.on) return; S.t = Math.max(20, Math.min(28, S.t + d)); paint() }
document.querySelectorAll('[data-d]').forEach(b => b.onclick = () => bump(+b.dataset.d))
$('temp').addEventListener('wheel', e => { e.preventDefault(); bump(e.deltaY < 0 ? 1 : -1) }, { passive: false })
const rg = $('range'), sl = $('slider')
// slider moves continuously; the reel follows the finger and snaps to the nearest degree on release
rg.step = 'any'
rg.addEventListener('input', () => { pos = +rg.value; const t = Math.round(pos); if (t !== S.t) S.t = t; paint() })
rg.addEventListener('pointerdown', () => { dragging = true; sl.classList.add('drag'); strip.classList.add('drag') })
const release = () => { if (!dragging) return; dragging = false; sl.classList.remove('drag'); strip.classList.remove('drag'); rg.value = S.t; paint() }
addEventListener('pointerup', release); rg.addEventListener('change', release)
paint()
</script>
</body>
