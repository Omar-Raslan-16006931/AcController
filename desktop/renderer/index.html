<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; script-src 'self'"
    />
    <title>AC Controller</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <defs>
        <g id="fan-glyph">
          <circle cx="12" cy="12" r="10.5" fill="none" stroke="currentColor" stroke-width="1.4" opacity=".35" />
          <circle cx="12" cy="12" r="1.9" />
          <path id="blade" d="M11 10.6C8.6 9.4 7.6 6.6 8.8 4.6c1.2-2 4.4-2.2 5.6-.2 1 1.7.3 3.9-1.6 6.1-.5.5-1.2.5-1.8.1Z" />
          <use href="#blade" transform="rotate(120 12 12)" />
          <use href="#blade" transform="rotate(240 12 12)" />
        </g>
      </defs>
    </svg>

    <div class="panel" id="panel">
      <!-- Sign in -->
      <section id="login" class="login hidden">
        <svg class="login-mark" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 2v20M3.3 7l17.4 10M20.7 7 3.3 17M9.5 3.8 12 6l2.5-2.2M9.5 20.2 12 18l2.5 2.2" />
        </svg>
        <h1>AC Controller</h1>
        <p class="muted">Sign in with the same account as the app.</p>
        <form id="login-form">
          <input id="email" type="email" placeholder="Email" autocomplete="username" required />
          <input id="password" type="password" placeholder="Password" autocomplete="current-password" required />
          <button type="submit" class="primary" id="login-btn">Sign in</button>
          <p class="error" id="login-error"></p>
        </form>
      </section>

      <!-- Remote -->
      <section id="remote" class="remote hidden">
        <div class="hd">
          <div class="t">
            <div class="name">Bedroom AC</div>
            <div class="status"><i id="dot"></i><span id="st">Connecting…</span></div>
          </div>
          <button class="gear" id="gear" aria-label="Settings" title="Settings">
            <svg class="ic" viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="3" />
              <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z" />
            </svg>
          </button>
          <button class="pw" id="pw" aria-label="Power">
            <svg class="ic" viewBox="0 0 24 24"><path d="M12 3v9M6.6 6.6a8 8 0 1 0 10.8 0" /></svg>
          </button>
        </div>

        <div class="scene" id="scene">
          <canvas id="air"></canvas>
          <div class="unit">
            <span class="led"></span><span class="disp" id="disp">--°</span>
            <div class="mouth"><div class="flap"></div></div>
          </div>
          <div class="temp" id="temp">
            <button class="step" id="minus" aria-label="Cooler">
              <svg class="ic" viewBox="0 0 24 24"><path d="M6 12h12" /></svg>
            </button>
            <span class="num" id="num"
              ><span class="reel"><span class="strip" id="strip"></span></span><sup>°C</sup></span
            >
            <button class="step" id="plus" aria-label="Warmer">
              <svg class="ic" viewBox="0 0 24 24"><path d="M6 12h12M12 6v12" /></svg>
            </button>
          </div>
        </div>

        <div class="slider" id="slider" style="--p: 0.5">
          <div class="fill"></div>
          <span class="end l"
            ><svg class="ic" viewBox="0 0 24 24"><path d="M12 2v20M3.3 7l17.4 10M20.7 7 3.3 17" /></svg></span
          ><span class="end r">28°</span>
          <input type="range" id="range" min="20" max="28" step="any" value="24" aria-label="Temperature" />
        </div>

        <div class="seg fan-seg" id="fan-seg" style="--n: 4; --i: 1">
          <span class="lens"></span>
          <button data-v="eco">
            <span class="fi"><svg viewBox="0 0 24 24" class="fan"><use href="#fan-glyph" /></svg
              ><svg viewBox="0 0 10 24" class="ws"><path class="ic" d="M5 9.5c2 0 3 1.2 3 2.5s-1 2.5-3 2.5" /></svg></span
            ><span class="fn">Eco</span>
          </button>
          <button data-v="low">
            <span class="fi"><svg viewBox="0 0 24 24" class="fan"><use href="#fan-glyph" /></svg><span class="w w1"><i></i></span></span
            ><span class="fn">Low</span>
          </button>
          <button data-v="medium">
            <span class="fi"><svg viewBox="0 0 24 24" class="fan"><use href="#fan-glyph" /></svg><span class="w w2"><i></i><i></i></span></span
            ><span class="fn">Med</span>
          </button>
          <button data-v="high">
            <span class="fi"><svg viewBox="0 0 24 24" class="fan"><use href="#fan-glyph" /></svg><span class="w w3"><i></i><i></i><i></i></span></span
            ><span class="fn">High</span>
          </button>
        </div>

        <div class="timer">
          <button class="tk" id="tk" title="Switch between turning off and turning on">
            <svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="13" r="8" /><path d="M12 9v4l2.5 2M9 2h6" /></svg
            ><span class="lab" id="tk-lab">Off in</span>
          </button>
          <div class="seg" id="presets" style="--n: 4; --i: 0">
            <span class="lens"></span>
            <button data-min="0">Off</button><button data-min="30">30m</button><button data-min="60">1h</button
            ><button data-min="120">2h</button>
          </div>
        </div>
        <div class="chips" id="chips"></div>

        <!-- Settings: slides over the remote -->
        <div class="settings" id="settings" aria-hidden="true">
          <div class="s-hd">
            <button class="back" id="back" aria-label="Back">
              <svg class="ic" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6" /></svg>
            </button>
            <span>Settings</span>
          </div>

          <div class="s-group">
            <label class="s-row">
              <span>Start with Windows</span>
              <input type="checkbox" id="autostart" class="switch" />
            </label>
            <button class="s-row" id="open-web">
              <span>Open full app</span>
              <svg class="ic chev" viewBox="0 0 24 24"><path d="M7 17 17 7M8 7h9v9" /></svg>
            </button>
          </div>

          <div class="s-group">
            <div class="s-row">
              <span class="s-col"><span>Updates</span><small id="upd-text">Version –</small></span>
              <button class="s-btn" id="upd-btn">Check</button>
            </div>
          </div>

          <div class="s-group">
            <div class="s-row">
              <span class="s-col"><span>Account</span><small id="acct">–</small></span>
              <button class="s-btn" id="signout">Sign out</button>
            </div>
            <button class="s-row danger" id="quit"><span>Quit AC Controller</span></button>
          </div>
        </div>

        <div class="toast" id="toast"></div>
      </section>
    </div>

    <canvas id="tray-canvas" width="32" height="32" hidden></canvas>
    <script src="app.js"></script>
  </body>
</html>
