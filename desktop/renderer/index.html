<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; script-src 'self'"
    />
    <title>AC Controller</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="panel" id="panel">
      <!-- Sign in -->
      <section id="login" class="login hidden">
        <svg class="login-mark" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 2v20M3.3 7l17.4 10M20.7 7 3.3 17M9.5 3.8 12 6l2.5-2.2M9.5 20.2 12 18l2.5 2.2" />
        </svg>
        <h1>AC Controller</h1>
        <p class="muted">Sign in with the same account as the app.</p>
        <form id="login-form">
          <input id="email" type="email" placeholder="Email" autocomplete="username" required />
          <input id="password" type="password" placeholder="Password" autocomplete="current-password" required />
          <button type="submit" class="primary" id="login-btn">Sign in</button>
          <p class="error" id="login-error"></p>
        </form>
      </section>

      <!-- Remote -->
      <section id="remote" class="remote hidden">
        <header class="top">
          <div class="title">
            <div class="room">Bedroom AC</div>
            <div class="state"><span class="dot" id="dot"></span><span id="state-text">Connecting…</span></div>
          </div>
          <button class="power" id="power" aria-label="Power">
            <span class="power-ring"></span>
            <svg viewBox="0 0 24 24"><path d="M12 3v9M6.6 6.6a8 8 0 1 0 10.8 0" /></svg>
          </button>
        </header>

        <!-- AC unit + live airflow -->
        <div class="scene" id="scene">
          <canvas id="air" class="air"></canvas>
          <div class="unit">
            <div class="unit-grille"></div>
            <div class="unit-brand">AC</div>
            <div class="unit-display">
              <span class="unit-mode" id="unit-mode"></span>
              <span class="unit-temp" id="unit-temp">--</span>
            </div>
            <div class="unit-led" id="unit-led"></div>
            <div class="unit-mouth">
              <div class="flap" id="flap"></div>
            </div>
          </div>
        </div>

        <!-- Temperature -->
        <div class="temp-row">
          <button class="step" id="minus" aria-label="Cooler">
            <svg viewBox="0 0 24 24"><path d="M6 12h12" /></svg>
          </button>
          <div class="temp">
            <span class="temp-num" id="temp">--</span><span class="temp-unit">°C</span>
            <div class="temp-sub" id="temp-sub">Cooling</div>
          </div>
          <button class="step" id="plus" aria-label="Warmer">
            <svg viewBox="0 0 24 24"><path d="M6 12h12M12 6v12" /></svg>
          </button>
        </div>
        <div class="slider" id="slider">
          <div class="slider-fill" id="slider-fill"></div>
          <div class="slider-ticks" id="ticks"></div>
          <input type="range" id="range" min="20" max="28" step="1" value="24" aria-label="Temperature" />
        </div>

        <!-- Mode + fan -->
        <div class="label">Mode</div>
        <div class="seg" id="mode-seg" style="--n: 3"></div>
        <div class="label">Fan</div>
        <div class="seg" id="fan-seg" style="--n: 4"></div>

        <!-- Timer -->
        <div class="label label-row">
          <span>Timer</span>
          <span class="mini-seg" id="timer-action">
            <button data-action="turn_off" class="on">Off after</button>
            <button data-action="turn_on">On after</button>
          </span>
        </div>
        <div class="presets" id="presets">
          <button data-min="15">15m</button>
          <button data-min="30">30m</button>
          <button data-min="60">1h</button>
          <button data-min="120">2h</button>
          <button data-min="240">4h</button>
        </div>
        <div class="timer-list" id="timer-list"></div>

        <footer class="foot">
          <button class="link" id="open-web">Open full app ↗</button>
          <label class="auto"><input type="checkbox" id="autostart" /> Start with Windows</label>
        </footer>
        <div class="toast" id="toast"></div>
      </section>
    </div>

    <canvas id="tray-canvas" width="32" height="32" hidden></canvas>
    <script src="app.js"></script>
  </body>
</html>
